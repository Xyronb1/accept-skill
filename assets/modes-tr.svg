<rect x="0.5" y="0.5" width="1199" height="329" rx="18" fill="url(#bg)" stroke="#26324d"/>
<text x="40" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#e6edf3" text-anchor="start" >Tek komut, üç mod</text><rect x="30" y="84" width="360" height="190" rx="16" fill="#111a2e" stroke="#818cf8" stroke-width="1.5"/><rect x="30" y="84" width="360" height="6" rx="3" fill="#818cf8"/><text x="52" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#818cf8" text-anchor="start" >Varsayılan</text><rect x="52" y="142" width="316" height="34" rx="8" fill="#0b1020" stroke="#26324d"/><text x="64" y="165" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, Menlo, monospace" font-size="14" font-weight="500" fill="#e6edf3" text-anchor="start" >/accept &lt;istek&gt;</text><text x="52" y="206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#94a3b8" text-anchor="start" >İsteği netleştirir,</text><text x="52" y="227" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#94a3b8" text-anchor="start" >nasıl anladığını söyler,</text><text x="52" y="248" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#94a3b8" text-anchor="start" >sonra işi yapar.</text><rect x="420" y="84" width="360" height="190" rx="16" fill="#111a2e" stroke="#fbbf24" stroke-width="1.5"/><rect x="420" y="84" width="360" height="6" rx="3" fill="#fbbf24"/><text x="442" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#fbbf24" text-anchor="start" >Önce sor</text><rect x="442" y="142" width="316" height="34" rx="8" fill="#0b1020" stroke="#26324d"/><text x="454" y="165" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, Menlo, monospace" font-size="14" font-weight="500" fill="#e6edf3" text-anchor="start" >/accept --sor &lt;istek&gt;</text><text x="442" y="206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#94a3b8" text-anchor="start" >Netleşmiş prompt'u</text><text x="442" y="227" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#94a3b8" text-anchor="start" >gösterir, onayını bekler.</text><text x="442" y="248" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#94a3b8" text-anchor="start" >Silme işlerinde ideal.</text><rect x="810" y="84" width="360" height="190" rx="16" fill="#111a2e" stroke="#2dd4bf" stroke-width="1.5"/><rect x="810" y="84" width="360" height="6" rx="3" fill="#2dd4bf"/><text x="832" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#2dd4bf" text-anchor="start" >Sadece prompt</text><rect x="832" y="142" width="316" height="34" rx="8" fill="#0b1020" stroke="#26324d"/><text x="844" y="165" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, Menlo, monospace" font-size="14" font-weight="500" fill="#e6edf3" text-anchor="start" >/accept --prompt &lt;istek&gt;</text><text x="832" y="206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#94a3b8" text-anchor="start" >İş yapmaz. Başka bir</text><text x="832" y="227" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#94a3b8" text-anchor="start" >yapay zekaya yapıştırmak</text><text x="832" y="248" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#94a3b8" text-anchor="start" >için prompt'u verir.</text><text x="600" y="306" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#94a3b8" text-anchor="middle" >Prompt dilini seçmek için --en veya --tr ekle  ·  --sor'un İngilizcesi --ask</text>
</svg>
