<rect x="30" y="30" width="430" height="410" rx="12" fill="#0d1426" stroke="#26324d"/><line x1="30" y1="66" x2="460" y2="66" stroke="#26324d"/><circle cx="50" cy="48" r="5" fill="#f87171"/><circle cx="66" cy="48" r="5" fill="#fbbf24"/><circle cx="82" cy="48" r="5" fill="#4ade80"/><text x="444" y="53" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#f87171" text-anchor="end" >ÖNCE</text><text x="54" y="100" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, Menlo, monospace" font-size="16" font-weight="700" fill="#94a3b8" text-anchor="start" >&gt;</text><text x="74" y="100" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, Menlo, monospace" font-size="15" font-weight="400" fill="#e6edf3" text-anchor="start" >şu scripti düzelt, çalışmıyor</text><text x="54" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#94a3b8" text-anchor="start" >Modelin tahmin etmesi gerekenler:</text><rect x="54" y="174" width="300" height="32" rx="8" fill="none" stroke="#f87171" stroke-dasharray="4 4" opacity="0.8"/><text x="70" y="196" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, Menlo, monospace" font-size="14" font-weight="500" fill="#f87171" text-anchor="start" >?  hangi script?</text><rect x="54" y="214" width="300" height="32" rx="8" fill="none" stroke="#f87171" stroke-dasharray="4 4" opacity="0.8"/><text x="70" y="236" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, Menlo, monospace" font-size="14" font-weight="500" fill="#f87171" text-anchor="start" >?  hata ne?</text><rect x="54" y="254" width="300" height="32" rx="8" fill="none" stroke="#f87171" stroke-dasharray="4 4" opacity="0.8"/><text x="70" y="276" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, Menlo, monospace" font-size="14" font-weight="500" fill="#f87171" text-anchor="start" >?  nasıl test edilecek?</text><rect x="54" y="294" width="300" height="32" rx="8" fill="none" stroke="#f87171" stroke-dasharray="4 4" opacity="0.8"/><text x="70" y="316" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, Menlo, monospace" font-size="14" font-weight="500" fill="#f87171" text-anchor="start" >?  hangi kabuk?</text><line x1="472" y1="235" x2="528" y2="235" stroke="#2dd4bf" stroke-width="3" marker-end="url(#arrTeal)"/><text x="500" y="222" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, Menlo, monospace" font-size="12" font-weight="700" fill="#2dd4bf" text-anchor="middle" >/accept</text><rect x="540" y="30" width="630" height="410" rx="12" fill="#0d1426" stroke="#26324d"/><line x1="540" y1="66" x2="1170" y2="66" stroke="#26324d"/><circle cx="560" cy="48" r="5" fill="#f87171"/><circle cx="576" cy="48" r="5" fill="#fbbf24"/><circle cx="592" cy="48" r="5" fill="#4ade80"/><text x="1154" y="53" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="end" >SONRA /accept</text><text x="564" y="96" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, Menlo, monospace" font-size="14" font-weight="700" fill="#2dd4bf" text-anchor="start" >Görev:</text><text x="684" y="96" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, Menlo, monospace" font-size="14" font-weight="400" fill="#e6edf3" text-anchor="start" >Script'i hatasız çalışır hale getir.</text><text x="564" y="128" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, Menlo, monospace" font-size="14" font-weight="700" fill="#2dd4bf" text-anchor="start" >Bağlam:</text><text x="684" y="128" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, Menlo, monospace" font-size="14" font-weight="400" fill="#e6edf3" text-anchor="start" >tools/backup.ps1 (sohbette geçen dosya)</text><text x="564" y="160" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, Menlo, monospace" font-size="14" font-weight="700" fill="#2dd4bf" text-anchor="start" >Ortam:</text><text x="684" y="160" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, Menlo, monospace" font-size="14" font-weight="400" fill="#e6edf3" text-anchor="start" >PowerShell 5.1</text><text x="564" y="192" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, Menlo, monospace" font-size="14" font-weight="700" fill="#2dd4bf" text-anchor="start" >Girdi:</text><text x="684" y="192" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, Menlo, monospace" font-size="14" font-weight="400" fill="#e6edf3" text-anchor="start" >hata mesajını oku, yoksa çalıştırıp al</text><text x="564" y="224" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, Menlo, monospace" font-size="14" font-weight="700" fill="#2dd4bf" text-anchor="start" >Başarı:</text><text x="684" y="224" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, Menlo, monospace" font-size="14" font-weight="400" fill="#e6edf3" text-anchor="start" >exit code 0, yedek klasörü var, boş değil</text><line x1="564" y1="270" x2="1146" y2="270" stroke="#26324d" stroke-dasharray="4 4"/><text x="564" y="304" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, Menlo, monospace" font-size="14" font-weight="700" fill="#e6edf3" text-anchor="start" >Ne değişti:</text><text x="574" y="338" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, Menlo, monospace" font-size="15" font-weight="800" fill="#4ade80" text-anchor="start" >+</text><text x="600" y="338" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, Menlo, monospace" font-size="14" font-weight="400" fill="#94a3b8" text-anchor="start" >Eklenenler: dosya, kabuk, başarı ölçütü</text><text x="574" y="368" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, Menlo, monospace" font-size="15" font-weight="800" fill="#fbbf24" text-anchor="start" >~</text><text x="600" y="368" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, Menlo, monospace" font-size="14" font-weight="400" fill="#94a3b8" text-anchor="start" >Varsayımlar: yok</text><text x="574" y="398" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, Menlo, monospace" font-size="15" font-weight="800" fill="#2dd4bf" text-anchor="start" >=</text><text x="600" y="398" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, Menlo, monospace" font-size="14" font-weight="400" fill="#94a3b8" text-anchor="start" >Değişen/çıkarılan: yok</text>
