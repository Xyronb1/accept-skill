, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8" text-anchor="start" >Rules check before</text><text x="628" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8" text-anchor="start" >any rewriting</text><line x1="785" y1="152.0" x2="806" y2="152.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/><rect x="810" y="100" width="168" height="104" rx="14" fill="#111a2e" stroke="#2dd4bf" stroke-width="1.5"/><circle cx="832" cy="124" r="12" fill="#2dd4bf"/><text x="832" y="129" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#0b1020" text-anchor="middle" >5</text><text x="852" y="129" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#e6edf3" text-anchor="start" >Fill the gaps</text><text x="824" y="162" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8" text-anchor="start" >conversation → default</text><text x="824" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8" text-anchor="start" >→ one short question</text><line x1="981" y1="152.0" x2="1002" y2="152.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/><rect x="1006" y="100" width="168" height="104" rx="14" fill="#111a2e" stroke="#2dd4bf" stroke-width="1.5"/><circle cx="1028" cy="124" r="12" fill="#2dd4bf"/><text x="1028" y="129" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#0b1020" text-anchor="middle" >6</text><text x="1048" y="129" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5