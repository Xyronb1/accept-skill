<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="Three modes, one command">
<title>Three modes, one command</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#0b1020"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#818cf8"/><stop offset="1" stop-color="#2dd4bf"/>
  </linearGradient>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
  </marker>
  <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#f87171"/>
  </marker>
  <marker id="arrTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#2dd4bf"/>
  </marker>
</defs>
<rect x="0.5" y="0.5" width="1199" height="329" rx="18" fill="url(#bg)" stroke="#26324d"/>
<text x="40" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#e6edf3" text-anchor="start" >Three modes, one command</text><rect x="30" y="84" width="360" height="190" rx="16" fill="#111a2e" stroke="#818cf8" stroke-width="1.5"/><rect x="30" y="84" width="360" height="6" rx="3" fill="#818cf8"/><text x="52" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#818cf8" text-anchor="start" >Default</text><rect x="52" y="142" width="316" height="34" rx="8" fill="#0b1020" stroke="#26324d"/><text x="64" y="165" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, Menlo, monospace" font-size="14" font-weight="500" fill="#e6edf3" text-anchor="start" >/accept &lt;request&gt;</text><text x="52" y="206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#94a3b8" text-anchor="start" >Clarifies the request,</text><text x="52" y="227" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#94a3b8" text-anchor="start" >says how it understood</text><text x="52" y="248" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#94a3b8" text-anchor="start" >it, then does the work.</text><rect x="420" y="84" width="360" height="190" rx="16" fill="#111a2e" stroke="#fbbf24" stroke-width="1.5"/><rect x="420" y="84" width="360" height="6" rx="3" fill="#fbbf24"/><text x="442" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#fbbf24" text-anchor="start" >Ask first</text><rect x="442" y="142" width="316" height="34" rx="8" fill="#0b1020" stroke="#26324d"/><text x="454" y="165" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, Menlo, monospace" font-size="14" font-weight="500" fill="#e6edf3" text-anchor="start" >/accept --ask &lt;request&gt;</text><text x="442" y="206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#94a3b8" text-anchor="start" >Shows the clarified</text><text x="442" y="227" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#94a3b8" text-anchor="start" >prompt and waits for</text><text x="442" y="248" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#94a3b8" text-anchor="start" >your OK. Great for deletes.</text><rect x="810" y="84" width="360" height="190" rx="16" fill="#111a2e" stroke="#2dd4bf" stroke-width="1.5"/><rect x="810" y="84" width="360" height="6" rx="3" fill="#2dd4bf"/><text x="832" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#2dd4bf" text-anchor="start" >Prompt only</text><rect x="832" y="142" width="316" height="34" rx="8" fill="#0b1020" stroke="#26324d"/><text x="844" y="165" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, Menlo, monospace" font-size="14" font-weight="500" fill="#e6edf3" text-anchor="start" >/accept --prompt &lt;request&gt;</text><text x="832" y="206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#94a3b8" text-anchor="start" >Does no work. Returns</text><text x="832" y="227" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#94a3b8" text-anchor="start" >the clarified prompt to</text><text x="832" y="248" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#94a3b8" text-anchor="start" >paste into another AI.</text><text x="600" y="306" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#94a3b8" text-anchor="middle" >Combine with --en or --tr to choose the prompt language  ·  --sor = --ask in Turkish</text>
</svg>
